<div class="max-w-4xl mx-auto px-6 py-8">
  <header class="mb-8">
    <div class="flex items-center gap-3 mb-1">
      <div class="w-9 h-9 bg-amber-500/20 rounded-[10px] flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177V3.75A1.5 1.5 0 0012.75 2.25h-1.5a1.5 1.5 0 00-1.5 1.5v4.877m4.5-1.877H9m0 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3 0h3.75m9.75 0h-9.75"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-text-primary tracking-tight">Solicitar Retiro Vehicular</h1>
        <p class="text-xs text-text-muted mt-0.5">Solicite el servicio de grúa para retirar un vehículo accidentado</p>
      </div>
    </div>
  </header>

  @if (error(); as e) {
    <div class="flex items-center gap-3 p-4 bg-red-500/10 border border-red-500/20 rounded-panel text-red-400 text-sm mb-6">
      <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ e }}</span>
    </div>
  }

  <div class="bg-white border border-border rounded-panel p-6 max-w-lg">
    <div class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-[0.55rem] font-bold uppercase tracking-wider text-text-muted">ID Accidente</label>
        <input
          class="bg-white border border-border text-text-primary rounded-sm px-3 py-2 text-sm outline-none transition-all focus:border-amber-500/40 w-full"
          placeholder="Ej: 12345"
          [value]="idaccidente()"
          (input)="idaccidente.set($any($event.target).value)" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[0.55rem] font-bold uppercase tracking-wider text-text-muted">Unidad de Grúa</label>
        <div class="relative">
          <select
            class="appearance-none bg-white border border-border text-text-primary rounded-sm px-3 py-2 pr-8 text-sm outline-none cursor-pointer transition-all hover:border-amber-500/40 focus:border-amber-500/40 w-full"
            [value]="idunidad() ?? ''"
            (change)="onUnidadChange($any($event.target).value)">
            <option value="" disabled>— Seleccione unidad —</option>
            @for (u of unidadesGrua(); track u.idunidademergencia) {
              <option [value]="u.idunidademergencia">{{ u.unidademergencia }} ({{ u.estadounidad }})</option>
            }
          </select>
          <svg class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        @if (cargando()) {
          <span class="text-[0.55rem] text-text-muted">Cargando unidades...</span>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[0.55rem] font-bold uppercase tracking-wider text-text-muted">Descripción</label>
        <textarea
          class="bg-white border border-border text-text-primary rounded-sm px-3 py-2 text-sm outline-none transition-all focus:border-amber-500/40 w-full min-h-[80px] resize-y"
          placeholder="Describa la situación del vehículo a retirar..."
          [value]="descripcion()"
          (input)="descripcion.set($any($event.target).value)"></textarea>
      </div>

      <button
        class="w-full py-2.5 bg-amber-500/20 border border-amber-500/40 text-amber-400 text-xs font-bold rounded-sm cursor-pointer transition-all hover:bg-amber-500/30 hover:text-amber-300 disabled:opacity-50 disabled:cursor-not-allowed mt-2"
        [disabled]="!idaccidente().trim() || !idunidad() || enviando()"
        (click)="solicitar()">
        @if (enviando()) {
          <span class="flex items-center justify-center gap-1.5">
            <svg class="w-3 h-3 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="32"/>
            </svg>
            Solicitando...
          </span>
        } @else {
          Solicitar Retiro
        }
      </button>
    </div>
  </div>
</div>
