<div class="bg-card rounded-card overflow-hidden">
  <!-- Modal Header -->
  <div class="flex items-center justify-between p-5 border-b border-border">
    <h3 class="text-lg font-bold text-text-primary">Actualizar Estado del Incidente</h3>
  </div>

  <div class="flex items-center gap-3 p-4 border-b border-border">
    <span class="text-[0.62rem] font-bold uppercase tracking-widest text-text-muted">Estado Actual</span>
    <span class="text-sm font-extrabold text-info bg-info/10 border border-info/20 px-3.5 py-1 rounded-full uppercase tracking-wide">{{ getEstadoLabel(estadoActual()) }}</span>
  </div>

  <!-- Loading State -->
  @if (cargando()) {
    <div class="flex flex-col items-center justify-center p-10 gap-4">
      <div class="w-8 h-8 border-[3px] border-info/10 border-t-info rounded-full animate-spin"></div>
      <p class="text-sm text-text-secondary">Cargando estados disponibles...</p>
    </div>
  } @else {
    <!-- Form Content -->
    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <!-- Error Message -->
      @if (error(); as err) {
        <div class="flex items-center gap-2.5 mx-6 mt-4 p-3 bg-danger/10 border border-danger/20 rounded-sm text-danger text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[18px] h-[18px] flex-shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <span>{{ err }}</span>
        </div>
      }

      <div class="p-6 flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label for="idtipoestadoincidente_id" class="text-xs font-semibold text-text-secondary">Nuevo estado:</label>
          <select 
            id="idtipoestadoincidente_id"
            formControlName="idtipoestadoincidente_id"
            class="w-full px-3.5 py-2.5 bg-white border border-border rounded-sm text-sm text-text-primary outline-none cursor-pointer focus:border-accent-gray/30"
            [class.border-danger/40]="isInvalid('idtipoestadoincidente_id')">
            <option value="" disabled selected>Seleccione un nuevo estado...</option>
            @for (est of estados(); track est.idtipoestadoincidente) {
              <option [value]="est.idtipoestadoincidente">{{ getEstadoLabel(est.tipoestadoincidente) }}</option>
            }
          </select>
          @if (isInvalid('idtipoestadoincidente_id')) {
            <span class="text-xs text-danger font-medium">{{ getError('idtipoestadoincidente_id') }}</span>
          }
        </div>
      </div>

      <!-- Action Footer -->
      <div class="flex items-center justify-end gap-3 p-[18px] border-t border-border">
        <button type="button" class="px-5 py-2.5 bg-transparent border border-border text-text-secondary rounded-sm font-semibold hover:bg-gray-50 hover:text-text-primary transition-all" (click)="onCancelar()" [disabled]="guardando()">
          Cancelar
        </button>
        <button type="submit" class="px-5 py-2.5 bg-sidebar text-white rounded-sm font-semibold hover:bg-sidebar-hover transition-all disabled:opacity-50" [disabled]="form.invalid || guardando()">
          @if (guardando()) {
            <span class="inline-flex items-center gap-1.5">
              <span class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin inline-block"></span>
              Guardando...
            </span>
          } @else {
            Confirmar Cambio
          }
        </button>
      </div>

    </form>
  }
</div>
